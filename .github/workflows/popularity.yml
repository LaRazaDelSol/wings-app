name: popularity

# Weekly build of popularity.v1.json, published to GitHub Pages.
# Triggers: schedule + manual only. Never pull_request_target. Secrets are used only by the build step, via env.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: popularity
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Unit tests (no network)
        run: python -m unittest discover -s tests
      - name: Restore provider response cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/http
          key: http-${{ github.run_id }}
          restore-keys: http-
      - name: Unpack title list from secret
        env:
          CATALOGUE_TITLES_GZ: ${{ secrets.CATALOGUE_TITLES_GZ }}
        run: |
          if [ -z "$CATALOGUE_TITLES_GZ" ]; then
            echo "::error::Repository secret CATALOGUE_TITLES_GZ is not set (see README: pack_titles.py)."; exit 1
          fi
          printf '%s' "$CATALOGUE_TITLES_GZ" | base64 -d | gzip -d > catalogue-titles.json
      - name: Build index
        env:
          WINGS_CONTACT: ${{ vars.WINGS_CONTACT }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          # IGDB is opt-in: set repository variable WINGS_PROVIDERS to "wikipedia,steam,igdb" to enable it.
          WINGS_PROVIDERS: ${{ vars.WINGS_PROVIDERS || 'wikipedia,steam' }}
        run: |
          python build_index.py --catalogue catalogue-titles.json --overrides overrides.json \
            --providers "$WINGS_PROVIDERS" --out site/popularity.v1.json --report out/report.md \
            --max-bytes 400000
      - name: Upload report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: report
          path: out/report.md
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  heartbeat:
    # GitHub disables scheduled workflows in public repos after 60 days without repository activity.
    # Commit a dated line each run so the schedule stays alive.
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Commit heartbeat
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > heartbeat.txt
          git add heartbeat.txt
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore: heartbeat $(cat heartbeat.txt)"
          git push
